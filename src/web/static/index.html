<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics Slide Creator</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="version" class="version"></div>

  <!-- ── 검색 페이지 ── -->
  <main id="page-search" class="page active">
    <section class="hero" id="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
      </div>
      <h1>Lyrics Slide Creator</h1>
      <p class="subtitle">멜론에서 노래를 검색하고 가사 슬라이드를 만들어보세요</p>

      <form class="search" id="search-form" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search-input" type="search" placeholder="노래 제목 또는 가수 이름" autofocus>
        <button type="submit" class="btn primary" id="search-btn">검색</button>
      </form>
    </section>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <!-- ── 편집 페이지 ── -->
  <main id="page-editor" class="page">
    <header class="editor-header">
      <div class="backdrop" id="backdrop"></div>
      <button class="btn ghost back" id="back-btn" title="뒤로 (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        뒤로
      </button>
      <img class="art large" id="editor-art" alt="">
      <div class="song-meta">
        <div class="song-title" id="editor-title"></div>
        <div class="song-sub" id="editor-sub"></div>
      </div>
    </header>

    <div class="editor-body">
      <section class="panel">
        <div class="panel-head">
          <h2>가사</h2>
          <div class="auto-split" id="auto-split">
            <span>자동 나누기</span>
            <button data-n="1">1줄</button>
            <button data-n="2">2줄</button>
            <button data-n="3">3줄</button>
          </div>
        </div>
        <textarea id="lyrics" spellcheck="false" placeholder="가사를 입력하세요"></textarea>
        <p class="hint" id="lyrics-hint"><kbd>빈 줄</kbd> 하나가 슬라이드 경계예요 · Enter 두 번으로 나누고, 빈 줄을 지우면 합쳐져요</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>슬라이드 <span class="count" id="slide-count"></span></h2>
          <div class="history">
            <button class="icon-btn" id="undo-btn" title="되돌리기 (⌘Z)" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
            </button>
            <button class="icon-btn" id="redo-btn" title="다시 실행 (⇧⌘Z)" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
            </button>
          </div>
        </div>
        <div class="slides" id="slides"></div>
        <p class="hint">줄을 <b>드래그</b>해서 옮기기 · 줄 사이 <b>✂</b> → 나누기 · 슬라이드 사이 → 합치기 · 클릭 → 가사로 이동</p>
      </section>
    </div>

    <footer class="editor-footer">
      <div class="template">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" /><path d="M8 21h8" /></svg>
        <span>템플릿</span>
        <strong id="template-name"></strong>
        <button class="btn ghost small" id="template-btn">변경</button>
      </div>
      <button class="btn primary large" id="generate-btn">
        <span class="label">PPT 생성</span>
        <span class="spinner"></span>
      </button>
    </footer>
  </main>

  <!-- ── 모달 / 토스트 ── -->
  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <details id="modal-detail-wrap"><summary>자세히 보기</summary><pre id="modal-detail"></pre></details>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
