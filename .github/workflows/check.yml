# PR·push 때 도는 가벼운 점검: 빌드 없이 단위 시험과 정적 검사만 한다 (빌드는 release.yml이 태그 때만)
name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Qt 실행 라이브러리 설치 (화면 없는 Linux 러너용)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: 의존성 설치
        run: pip install -r requirements.txt ruff==0.17.0

      - name: 단위 시험
        run: python -m unittest discover -s tests -t . -v

      - name: 정적 검사
        run: ruff check --select F401,E722 .
