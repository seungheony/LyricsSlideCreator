# 태그를 올리면 Windows/macOS 빌드 → 검증 → GitHub 릴리스 업로드
#   v1.2.0-beta.1 → 프리릴리스(베타 사용자에게만 업데이트 알림). 업데이트·기능 테스트용
#   v1.2.0        → 정식 릴리스. 테스트를 마친 베타와 같은 커밋에 단다 (docs/RELEASE_CHECKLIST.md)
# 태그는 scripts/release.sh 로 단다. PR에서는 실행하지 않는다
# Actions 탭에서 수동 실행(workflow_dispatch)하면 릴리스 없이 빌드·검증만 한다
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '시험 빌드 버전 (릴리스는 만들지 않음)'
        required: true
        default: '0.0.0-test.1'

permissions:
  contents: write

env:
  # Windows 빌드 서버의 기본 출력 인코딩은 한글을 못 써서 스크립트 출력이 실패할 수 있다
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Inno Setup 설치
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 버전 결정
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push) v="${GITHUB_REF_NAME#v}" ;;
            *) v="${{ inputs.version }}" ;;
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: 빌드
        run: python scripts/build.py ${{ env.VERSION }}

      - name: 검증 (Windows 설치 → 실행 → 제거)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows.ps1 -Version ${{ env.VERSION }}

      - name: 검증 (macOS 자체 점검)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/Lyrics Slide Creator.app/Contents/MacOS/run" --self-test'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/LyricsSlideCreator-*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 릴리스 노트 범위를 정하려고 태그 목록이 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 체크섬 생성
        working-directory: dist
        run: sha256sum LyricsSlideCreator-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          args=(--generate-notes)
          case "$tag" in
            *-*)
              args+=(--prerelease) ;;
            *)
              # 정식 태그는 테스트한 베타와 같은 커밋에 달리므로 기본값(바로 이전 릴리스)이면 노트가 비어버린다
              prev=$(python3 scripts/notes_start_tag.py "$tag")
              if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi ;;
          esac
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --title "$tag" "${args[@]}"
