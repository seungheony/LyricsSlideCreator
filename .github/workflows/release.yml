# 태그를 올리면 Windows/macOS 빌드 → 검증 → GitHub 릴리스 업로드
#   v1.2.0-beta.1 → 프리릴리스(베타 사용자에게만 업데이트 알림). 업데이트·기능 테스트용
#   v1.2.0        → 정식 릴리스. 테스트를 마친 베타와 같은 커밋에 단다 (docs/RELEASE_CHECKLIST.md)
# 태그는 scripts/release.sh 로 단다. PR에서는 실행하지 않는다
# Actions 탭에서 수동 실행(workflow_dispatch)하면 릴리스 없이 빌드·검증만 한다
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '시험 빌드 버전 (릴리스는 만들지 않음)'
        required: true
        default: '0.0.0-test.1'

permissions:
  contents: write

env:
  # Windows 빌드 서버의 기본 출력 인코딩은 한글을 못 써서 스크립트 출력이 실패할 수 있다
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Inno Setup 설치
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 버전 결정
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push) v="${GITHUB_REF_NAME#v}" ;;
            *) v="${{ inputs.version }}" ;;
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # 빌드(Windows는 15분 넘게 걸림) 전에 소스 상태로 먼저 확인해 코드 문제를 빨리 찾는다.
      # 여기서는 통과하는데 빌드한 앱만 실패하면 패키징(Nuitka 포함 파일 등) 문제다
      - name: 소스로 자체 점검
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
          PYTHONFAULTHANDLER: '1'
        run: python run.py --self-test

      - name: 빌드
        run: python scripts/build.py ${{ env.VERSION }}

      - name: 검증 (Windows 설치 → 실행 → 제거)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows.ps1 -Version ${{ env.VERSION }}

      # 검증이 실패하면 설치된 앱을 디버거로 다시 실행해 어디서 죽었는지(DLL·함수) 남긴다
      - name: 실패 원인 진단 (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\LyricsSlideCreator\LyricsSlideCreator.exe'
          if (-not (Test-Path $exe)) { Write-Host "설치된 앱이 없음: $exe"; exit 0 }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb) {
            Write-Host '== 디버거로 실행 (처음 일어난 접근 위반 지점)'
            & $cdb.FullName -g -G -c '.lastevent; r; ln @rip; kn 60; q' $exe --self-test 2>&1 | Select-Object -Last 120 | Write-Host
          } else {
            Write-Host 'cdb 없음: 디버거 진단 건너뜀'
          }
          Write-Host '== Qt 플러그인 로딩 기록'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Write-Host "종료 코드 $($p.ExitCode)"
          Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -Last 60 | Write-Host

      - name: 검증 (macOS 자체 점검)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/가사 슬라이드 생성기.app/Contents/MacOS/run" --self-test'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/LyricsSlideCreator-*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 릴리스 노트 범위를 정하려고 태그 목록이 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 체크섬 생성
        working-directory: dist
        run: sha256sum LyricsSlideCreator-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          args=(--generate-notes)
          case "$tag" in
            *-*)
              args+=(--prerelease) ;;
            *)
              # 정식 태그는 테스트한 베타와 같은 커밋에 달리므로 기본값(바로 이전 릴리스)이면 노트가 비어버린다
              prev=$(python3 scripts/notes_start_tag.py "$tag")
              if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi ;;
          esac
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --title "$tag" "${args[@]}"
